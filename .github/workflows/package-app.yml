name: Package desktop apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to create or update (for example, v1.0.0)
        required: true
        default: v1.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare GitHub release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Determine release tag
        id: release
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=$MANUAL_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --generate-notes

  package-windows:
    name: Windows (x64)
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build application JAR
        run: .\mvnw.cmd --batch-mode clean package

      - name: Create self-contained application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/package-input
          Copy-Item target/WaterQuest.jar target/package-input/
          jpackage --type app-image --name WaterQuest --app-version 1.0.0 --vendor "SB015" --icon packaging/icons/h20escapegame.ico --input target/package-input --main-jar WaterQuest.jar --main-class application.Launcher --dest target/package
          Compress-Archive -Path target/package/WaterQuest -DestinationPath WaterQuest-Windows-x64.zip

      - name: Upload package to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: gh release upload $env:RELEASE_TAG WaterQuest-Windows-x64.zip --repo $env:GITHUB_REPOSITORY --clobber

  package-macos:
    name: macOS (${{ matrix.arch }})
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: Intel
            artifact: WaterQuest-macOS-Intel
          - runner: macos-14
            arch: Apple-Silicon
            artifact: WaterQuest-macOS-Apple-Silicon

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build application JAR
        run: ./mvnw --batch-mode clean package

      - name: Create self-contained application
        run: |
          mkdir -p target/package-input
          cp target/WaterQuest.jar target/package-input/
          jpackage --type app-image --name WaterQuest --app-version 1.0.0 --vendor "SB015" --icon packaging/icons/h20escapegame.icns --input target/package-input --main-jar WaterQuest.jar --main-class application.Launcher --dest target/package
          ditto -c -k --sequesterRsrc --keepParent target/package/WaterQuest.app "${{ matrix.artifact }}.zip"

      - name: Upload package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" "${{ matrix.artifact }}.zip" --repo "$GITHUB_REPOSITORY" --clobber
