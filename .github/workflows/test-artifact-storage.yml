name: Test Artifact Storage

on:
  workflow_dispatch:

jobs:
  test-artifact-storage:
    runs-on: ubuntu-latest
    steps:
      - name: Create test artifact
        run: echo 'GitHub Actions artifact storage test' > artifact-test.txt

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-storage-test
          path: artifact-test.txt
          retention-days: 1
